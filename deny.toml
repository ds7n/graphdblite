# cargo-deny configuration. Run with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Allow-list — every license used by a transitive dep must appear here.
# Re-run `cargo deny check licenses` after dep changes; add the SPDX id
# (and confirm compatibility with MPL-2.0) before whitelisting.
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members publish a graph-DB API surface; runtime panics from
# bad deps would surface as data corruption — keep this strict.
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
