name: Python Wheels (macOS + PyPI)

# Builds macOS wheels and sdist, then publishes all wheels to PyPI.
# Linux and Windows wheels are built locally via scripts/build-release.sh
# and uploaded to the GitHub release via scripts/publish-release.sh.
#
# Disabled for now — uncomment the tag trigger when macOS wheels are needed.

on:
  workflow_dispatch: # manual only for now
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: read

jobs:
  build-wheels-macos:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64
            manylinux: auto
          - os: macos-latest
            target: aarch64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8
        # PyO3/maturin-action drives cibuildwheel (which brings its own
        # per-target Pythons), but a host Python is needed for the prelude.
        # uv installs one via python-build-standalone.

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
          manylinux: ${{ matrix.manylinux }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path bindings/python/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build-wheels-macos, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
