[package]
name = "graphdblite-node"
version.workspace = true
edition.workspace = true
description = "Node.js bindings for graphdblite via napi-rs"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
graphdblite = { path = "../.." }
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
