[package]
name = "graphdblite-python"
version.workspace = true
edition.workspace = true
description = "Python bindings for graphdblite"
license.workspace = true
publish = false

[lib]
name = "_graphdblite"
crate-type = ["cdylib"]

[features]
# Test-only: compiles the core's deliberate-panic hook so the test suite can
# check panic containment. Never enable for release builds.
test-hooks = ["graphdblite/test-hooks"]

[dependencies]
graphdblite = { path = "../.." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310", "generate-import-lib"] }
