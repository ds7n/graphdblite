[workspace]
members = [".", "crates/python", "crates/ffi", "crates/node"]
resolver = "2"

[package]
name = "graphdblite"
version = "0.1.0"
edition = "2021"
description = "Embedded graph database with Cypher support. SQLite-grade simplicity, graph-native performance."
license = "MPL-2.0"

[lib]
crate-type = ["lib"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
indexmap = "2"
pest = "2"
pest_derive = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "graphdblite"
path = "src/bin/cli.rs"
