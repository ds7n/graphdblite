[package]
name = "graphdblite-node"
version = "0.1.0"
edition = "2021"
description = "Node.js bindings for graphdblite via napi-rs"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
graphdblite = { path = "../.." }
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
