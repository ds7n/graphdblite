name: Release (macOS)

# Builds macOS artifacts and appends them to an existing release.
# Linux and Windows artifacts are built locally via scripts/build-release.sh
# and published via scripts/publish-release.sh before pushing the tag.
#
# Disabled for now — uncomment the trigger when macOS builds are needed.

on:
  workflow_dispatch: # manual only for now
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: write

# See ci.yml — bumps rustc's per-thread stack to avoid cold-cache
# typeck SIGSEGV.
env:
  RUST_MIN_STACK: 16777216

jobs:
  build-cli-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --release --bin graphdblite --target aarch64-apple-darwin

      - name: Package
        run: |
          tar czf graphdblite-aarch64-apple-darwin.tar.gz \
            -C target/aarch64-apple-darwin/release graphdblite
          sha256sum graphdblite-aarch64-apple-darwin.tar.gz \
            > graphdblite-aarch64-apple-darwin.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cli-aarch64-apple-darwin
          path: |
            graphdblite-aarch64-apple-darwin.tar.gz
            graphdblite-aarch64-apple-darwin.tar.gz.sha256

  build-ffi-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        run: cargo build --release -p graphdblite-ffi --target aarch64-apple-darwin

      - name: Package
        run: |
          mkdir -p staging
          cp bindings/ffi/graphdblite.h staging/
          cp target/aarch64-apple-darwin/release/libgraphdblite_ffi.a staging/ 2>/dev/null || true
          cp target/aarch64-apple-darwin/release/libgraphdblite_ffi.dylib staging/ 2>/dev/null || true
          tar czf graphdblite-ffi-aarch64-apple-darwin.tar.gz -C staging .

      - uses: actions/upload-artifact@v4
        with:
          name: ffi-aarch64-apple-darwin
          path: graphdblite-ffi-aarch64-apple-darwin.tar.gz

  build-node-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx napi build --platform --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node

  upload:
    needs: [build-cli-macos, build-ffi-macos, build-node-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: artifacts/

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --clobber
