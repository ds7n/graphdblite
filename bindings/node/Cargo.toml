[package]
name = "graphdblite-node"
version.workspace = true
edition.workspace = true
description = "Node.js bindings for graphdblite via napi-rs"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Test-only: compiles the core's deliberate-panic hook so the test suite can
# check panic containment. Never enable for release builds.
test-hooks = ["graphdblite/test-hooks"]

[dependencies]
graphdblite = { path = "../.." }
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
