name: CI (fast)

# Fast tier — manual fallback only. Primary CI runs on the self-hosted
# Forgejo runner (.forgejo/workflows/ci.yml). This workflow is kept as
# a safety net for when the local runner is unavailable; trigger via
# the Actions tab → "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: read

# Cold-cache test builds have hit SIGSEGV during typeck at rustc's 8MB
# default per-thread stack. Bump it preemptively (rustc's own panic
# message recommends this exact value). The criterion bench crate
# lives in its own workspace under `benches-crate/` and isn't built
# by `cargo test --workspace`.
env:
  RUST_MIN_STACK: 16777216

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v3
        # No setup-python — uv ships python-build-standalone and
        # auto-installs whatever version `uv venv --python X.Y` asks for.
      - name: Build and install Python binding
        working-directory: bindings/python
        run: |
          uv venv --python 3.13
          uv pip install maturin pytest
          uv run maturin develop --release
      - name: Run conformance suite
        working-directory: bindings/python
        run: uv run pytest tests/conformance/ -v

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make -C bindings/go test

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx napi build --platform --release
      - run: npm test

  c:
    runs-on: ubuntu-latest
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make -C bindings/ffi conformance
