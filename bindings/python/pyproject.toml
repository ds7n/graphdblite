[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "graphdblite"
dynamic = ["version"]
description = "Embedded graph database with Cypher support"
requires-python = ">=3.10"

[tool.maturin]
module-name = "graphdblite._graphdblite"
python-source = "python"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
