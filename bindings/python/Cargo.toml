[package]
name = "graphdblite-python"
version.workspace = true
edition.workspace = true
description = "Python bindings for graphdblite"
license.workspace = true
publish = false

[lib]
name = "_graphdblite"
crate-type = ["cdylib"]

[dependencies]
graphdblite = { path = "../.." }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }
