# cargo-deny configuration. Run with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Test-only (cucumber -> humantime, TCK harness).
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained; TCK-only via cucumber" },
]

[licenses]
version = 2
# Allow-list — every license used by a transitive dep must appear here.
# graphdblite itself is MIT; this list governs what we accept *from*
# upstream deps. Re-run `cargo deny check licenses` after dep changes
# and add the SPDX id (and confirm compatibility with MIT) before
# whitelisting.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
    # Apache-2.0 plus an extra permission (ar_archive_writer, via stacker).
    "Apache-2.0 WITH LLVM-exception",
    # Permissive, MIT-style, OSI approved (synthez*, via cucumber/TCK).
    "BlueOak-1.0.0",
    # Permissive, OSI approved (foldhash, via hashbrown; ships at runtime).
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members publish a graph-DB API surface; runtime panics from
# bad deps would surface as data corruption — keep this strict.
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
