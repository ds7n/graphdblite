[workspace]
members = [".", "bindings/python", "bindings/ffi", "bindings/node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[package]
name = "graphdblite"
version.workspace = true
edition.workspace = true
description = "Embedded graph database with Cypher support. SQLite-grade simplicity, graph-native performance."
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
indexmap = "2"
pest = "2"
pest_derive = "2"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"

[dev-dependencies]
tempfile = "3"
cucumber = "0.21"
anyhow = "1"
pollster = "0.3"

[[bin]]
name = "graphdblite"
path = "src/bin/cli.rs"

# openCypher TCK conformance harness — see tests/tck.rs.
# Uses a custom main (not libtest) because cucumber-rs drives its own runner.
[[test]]
name = "tck"
harness = false
