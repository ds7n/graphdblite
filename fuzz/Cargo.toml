[package]
name = "graphdblite-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.graphdblite]
path = ".."
features = ["fuzzing"]

# Fuzz targets are not workspace members of the parent workspace —
# cargo-fuzz invokes them via `cargo +nightly fuzz run <target>` from this dir.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_and_plan"
path = "fuzz_targets/parse_and_plan.rs"
test = false
doc = false
bench = false
