name: Dependency Audit

# Catches advisories published AFTER a release: a scheduled run fails when a
# new RustSec advisory (vulnerability, unmaintained, yanked) hits Cargo.lock,
# even if no code changed. GitHub emails the user who last edited the cron.
# Also runs when dependency manifests or the deny policy change.
#
# cargo-deny reads the same RustSec database as cargo-audit, so it is the
# single advisory gate (plus licenses, bans, sources). Policy: deny.toml.
# Non-Rust ecosystems (npm devDeps, pytest, Go stdlib-only) are covered by
# Dependabot (.github/dependabot.yml) and its security alerts.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    # Split from the policy checks so a fresh advisory is reported on its own
    # and never masks (or is masked by) a license/ban failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
          command-arguments: bans licenses sources
