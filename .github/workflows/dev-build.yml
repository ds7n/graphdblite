name: Build & Release

# Two trigger modes:
#   - workflow_dispatch  → republishes the rolling `dev-latest` prerelease.
#   - push of a v* tag   → publishes a fixed release at that tag.
# Both modes run the full 7-platform binary matrix (CLI, FFI, Node addon,
# Python wheels). Wheels are also pushed to PyPI by python-wheels.yml on
# the same tag-push event — kept in a separate workflow so the PyPI
# publishing step doesn't gate the GitHub release artifacts.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# See ci.yml — bumps rustc's per-thread stack to avoid cold-cache
# typeck SIGSEGV.
env:
  RUST_MIN_STACK: 16777216

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # fmt + clippy only need to run once. Skipping on macOS/Windows avoids
      # CRLF-vs-LF false positives from rustfmt on Windows checkouts and
      # cuts redundant work — the lint outcome is platform-independent.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check --all
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build-cli:
    needs: [test, lint-workflows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --bin graphdblite --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --bin graphdblite --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar czf graphdblite-${{ matrix.target }}.${{ matrix.ext }} \
            -C target/${{ matrix.target }}/release graphdblite

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\graphdblite.exe `
            -DestinationPath graphdblite-${{ matrix.target }}.${{ matrix.ext }}

      - name: Checksum
        shell: bash
        run: |
          sha256sum graphdblite-${{ matrix.target }}.${{ matrix.ext }} \
            > graphdblite-${{ matrix.target }}.${{ matrix.ext }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            graphdblite-${{ matrix.target }}.${{ matrix.ext }}
            graphdblite-${{ matrix.target }}.${{ matrix.ext }}.sha256

  build-ffi:
    needs: [test, lint-workflows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Two Windows builds:
          #   - MSVC: for C consumers, Node addon, Python wheel — Windows-native ABI.
          #   - GNU/MinGW: for Go cgo, which uses gcc-style linker invocations and
          #     expects a `libgraphdblite_ffi.a` static archive.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      # bindings/ffi/build.rs skips cbindgen when HOST != TARGET (cross
      # compile guard) and falls back to copying a pre-existing
      # bindings/ffi/graphdblite.h. Generate that header now via a host
      # `cargo check` — runs build.rs on the host arch and writes the
      # header to the crate root, where the cross build will pick it up.
      - name: Pre-generate FFI header (host)
        shell: bash
        run: cargo check -p graphdblite-ffi

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release -p graphdblite-ffi --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p graphdblite-ffi --target ${{ matrix.target }}

      # Go 1.26.11+ rejects static libraries carrying LLVM bitcode sections
      # (Rust's std objects embed them). The release-go workflow ships these
      # archives in the Go module, so strip them here. MSVC builds have no .a.
      - name: Strip LTO sections from static library (Go cgo)
        shell: bash
        run: |
          lib=target/${{ matrix.target }}/release/libgraphdblite_ffi.a
          if [ -f "$lib" ]; then
            scripts/strip-lto-sections.sh "$lib"
          else
            echo "no $lib (expected for MSVC)"
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp bindings/ffi/graphdblite.h staging/
          cp target/${{ matrix.target }}/release/libgraphdblite_ffi.a staging/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libgraphdblite_ffi.so staging/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/libgraphdblite_ffi.dylib staging/ 2>/dev/null || true
          tar czf graphdblite-ffi-${{ matrix.target }}.tar.gz -C staging .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item bindings\ffi\graphdblite.h staging\
          # MSVC outputs (x86_64-pc-windows-msvc): .dll, .dll.lib, .lib
          Copy-Item target\${{ matrix.target }}\release\graphdblite_ffi.dll staging\ -ErrorAction SilentlyContinue
          Copy-Item target\${{ matrix.target }}\release\graphdblite_ffi.dll.lib staging\ -ErrorAction SilentlyContinue
          Copy-Item target\${{ matrix.target }}\release\graphdblite_ffi.lib staging\ -ErrorAction SilentlyContinue
          # MinGW outputs (x86_64-pc-windows-gnu): libgraphdblite_ffi.a, .dll, .dll.a — for Go cgo
          Copy-Item target\${{ matrix.target }}\release\libgraphdblite_ffi.a staging\ -ErrorAction SilentlyContinue
          Copy-Item target\${{ matrix.target }}\release\libgraphdblite_ffi.dll.a staging\ -ErrorAction SilentlyContinue
          Compress-Archive -Path staging\* -DestinationPath graphdblite-ffi-${{ matrix.target }}.zip

      - name: Checksum
        shell: bash
        run: |
          for f in graphdblite-ffi-${{ matrix.target }}.*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ffi-${{ matrix.target }}
          path: |
            graphdblite-ffi-${{ matrix.target }}.*

  build-node:
    needs: [test, lint-workflows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_zig: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install

      - name: Build (native)
        if: ${{ !matrix.use_zig }}
        run: npx napi build --platform --release --target ${{ matrix.target }}

      # Inline zig install (only on the ubuntu cross-compile legs of this
      # matrix). Previously used mlugg/setup-zig@v2, but that action's
      # JavaScript runtime is Node 20, which GitHub Actions force-migrates
      # to Node 24 on 2026-06-02 and removes entirely 2026-09-16. The
      # setup-zig project also moved primary hosting off GitHub, so the
      # GitHub mirror is unlikely to ship a Node-24 release in time.
      # Zig is a single static binary — install by hand.
      - name: Install zig
        if: matrix.use_zig
        working-directory: ${{ runner.temp }}
        run: |
          ZIG_VERSION=0.14.1
          # Note: official filename is `zig-x86_64-linux-X.Y.Z.tar.xz`
          # (target-host order, not host-target).
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            -o zig.tar.xz
          tar -xJf zig.tar.xz
          ZIG_DIR="${{ runner.temp }}/zig-x86_64-linux-${ZIG_VERSION}"
          # Newer rustc passes --fix-cortex-a53-843419 when linking
          # aarch64-unknown-linux-musl; zig's linker rejects it ("unsupported
          # linker arg"). A `zig` shim earlier on PATH drops that argument and
          # runs the real zig (cargo-zigbuild, which `napi build -x` drives,
          # calls `zig` from PATH).
          mkdir -p zig-shim
          # The single-quoted lines are the shim's own source; $ must stay literal.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'args=()' \
            'for a in "$@"; do' \
            '  case "$a" in' \
            '    --fix-cortex-a53-843419|-Wl,--fix-cortex-a53-843419) ;;' \
            '    *) args+=("$a") ;;' \
            '  esac' \
            'done' \
            "exec \"$ZIG_DIR/zig\" \"\${args[@]}\"" > zig-shim/zig
          chmod +x zig-shim/zig
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          # Added last so it takes precedence over the real zig.
          echo "${{ runner.temp }}/zig-shim" >> "$GITHUB_PATH"

      - name: Build (zig cross)
        if: matrix.use_zig
        run: |
          zig version
          # napi-rs CLI v3: `--cross-compile` (-x) builds non-Windows targets
          # with cargo-zigbuild (auto-installed) using the zig on PATH.
          npx napi build --platform --release --target ${{ matrix.target }} --cross-compile

      - uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node

  # On tag push, publish the per-platform .node packages and the main
  # wrapper to npm via npm trusted publishing (OIDC): no token. Each of the
  # 8 packages has a GitHub Actions trusted publisher for this repo and
  # workflow file (dev-build.yml) on npmjs.com. Requires npm >= 11.5.1 and
  # Node >= 22.14; provenance is attached automatically.
  # On a manual run (workflow_dispatch) the packages are staged and their
  # contents printed, but nothing is published: use it to check a release.
  publish-npm:
    needs: build-node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.21.1 && npm --version
      - name: Install Node deps
        working-directory: bindings/node
        run: npm install
      - uses: actions/download-artifact@v8
        with:
          path: bindings/node/artifacts
          pattern: node-*
          merge-multiple: true
      - name: List downloaded artifacts
        working-directory: bindings/node
        run: ls -R artifacts
      - name: Stage per-platform npm packages
        working-directory: bindings/node
        run: |
          # napi-rs CLI v3: one npm/<platform>/ dir per `napi.targets` entry
          # in package.json, then copy each downloaded .node into its dir.
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          # Writes optionalDependencies (one per platform package, same
          # version) into package.json so npm installs only the matching
          # binary. Publishing stays in the steps below (OIDC).
          npx napi pre-publish --npm-dir npm --tag-style npm --skip-optional-publish --no-gh-release
          echo "--- npm tree ---"
          ls -R npm
      - name: Check package contents
        working-directory: bindings/node
        run: |
          node -e "const p=require('./package.json'); const o=p.optionalDependencies||{}; console.log(o); if (Object.keys(o).length !== p.napi.targets.length || Object.values(o).some(v => v !== p.version)) process.exit(1)"
          npm pack --dry-run 2>&1 | tee pack-main.txt
          if grep -qE '\.node$' pack-main.txt; then
            echo "main package must not contain .node binaries" >&2
            exit 1
          fi
          for d in npm/*/; do
            (cd "$d" && npm pack --dry-run 2>&1 | grep -E 'notice (name|version|[0-9.]+[kMG]?B )')
          done
      - name: Publish per-platform packages
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: bindings/node
        run: |
          for d in npm/*/; do
            echo "Publishing $d"
            (cd "$d" && npm publish --access public)
          done
      - name: Publish main wrapper
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: bindings/node
        run: npm publish --access public

  # Publish the Rust crate to crates.io via trusted publishing (OIDC): no
  # token. crates.io has a GitHub trusted publisher for this repo and
  # workflow file (dev-build.yml); rust-lang/crates-io-auth-action swaps the
  # job's OIDC token for a short-lived publish token and revokes it when the
  # job ends. Runs only after every build and conformance job passes,
  # because a crates.io publish cannot be undone. On a manual run it does a
  # dry run instead.
  publish-crate:
    needs: collect-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "graphdblite") | .version')"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match crate version ${crate_version}" >&2
            exit 1
          fi
      - name: Dry run (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cargo publish --dry-run -p graphdblite
      # Runs on manual runs too: a successful token exchange proves the
      # crates.io trusted publisher config matches; the token goes unused
      # and is revoked when the job ends.
      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish -p graphdblite

  build-wheels:
    needs: [test, lint-workflows]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - os: macos-latest
            target: x86_64
            manylinux: auto
          - os: macos-latest
            target: aarch64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        # PyO3/maturin-action drives cibuildwheel which brings its own
        # per-target Pythons, but a host Python is still needed for the
        # action's prelude. uv installs one via python-build-standalone.

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path bindings/python/Cargo.toml
          manylinux: ${{ matrix.manylinux }}

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  test-go:
    needs: build-ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false  # binding has no non-stdlib deps; no go.sum to key on
      - name: Build FFI and run Go tests
        run: make -C bindings/go test

  test-ffi-conformance:
    needs: [test, lint-workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build FFI and run C conformance suite
        run: make -C bindings/ffi conformance

  test-python-conformance:
    needs: [test, lint-workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.4.0
        # uv handles Python install — no separate actions/setup-python step.
      - name: Build and install Python binding
        working-directory: bindings/python
        run: |
          uv venv --python 3.13
          uv pip install maturin pytest
          uv run maturin develop --release
      - name: Run conformance suite
        working-directory: bindings/python
        run: uv run pytest tests/conformance/ -v

  test-node-conformance:
    needs: [test, lint-workflows]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: Build native addon
        run: npx napi build --platform --release
      - name: Run conformance suite
        run: npm test

  # Common artifact-collection job — runs for both dev-latest and tag releases.
  # Publishes nothing on its own; the two publish-* jobs below consume its
  # uploaded artifacts.
  collect-artifacts:
    needs: [build-cli, build-ffi, build-node, build-wheels, test-go, test-ffi-conformance, test-python-conformance, test-node-conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli/
      - uses: actions/download-artifact@v8
        with:
          pattern: ffi-*
          merge-multiple: true
          path: ffi/
      - uses: actions/download-artifact@v8
        with:
          pattern: node-*
          merge-multiple: true
          path: node/
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels/
      - name: Combine checksums
        run: cat cli/*.sha256 ffi/*.sha256 > sha256sums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            cli/
            ffi/
            node/
            wheels/
            sha256sums.txt

  publish-dev-latest:
    if: github.event_name == 'workflow_dispatch'
    needs: collect-artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: bundle/
      - name: Replace rolling dev-latest release
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest \
            --title "Dev Build (latest main)" \
            --notes "Rolling development build from main branch.
          Commit: ${{ github.sha }}
          Date: $(date -u +%Y-%m-%d)

          ## Artifacts
          - **CLI binaries**: Linux (x86_64, arm64, musl x86_64, musl arm64), macOS (x86_64, arm64), Windows (x86_64)
          - **Python wheels**: full PyPI matrix (glibc + musl Linux, macOS, Windows)
          - **C FFI libraries**: same 7 targets as CLI, plus Windows MinGW for Go cgo
          - **Node.js addons**: same 7 targets as CLI" \
            --prerelease \
            --target ${{ github.sha }} \
            bundle/cli/graphdblite-*.tar.gz bundle/cli/graphdblite-*.zip bundle/sha256sums.txt \
            bundle/ffi/graphdblite-ffi-*.tar.gz bundle/ffi/graphdblite-ffi-*.zip \
            bundle/node/*.node \
            bundle/wheels/*.whl

  publish-tag-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: collect-artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: bundle/
      - name: Create release for ${{ github.ref_name }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}.
          Commit: ${{ github.sha }}

          ## Artifacts
          - **CLI binaries**: Linux (x86_64, arm64, musl x86_64, musl arm64), macOS (x86_64, arm64), Windows (x86_64)
          - **Python wheels**: full PyPI matrix (glibc + musl Linux, macOS, Windows)
          - **C FFI libraries**: same 7 targets as CLI, plus Windows MinGW for Go cgo
          - **Node.js addons**: same 7 targets as CLI

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details." \
            bundle/cli/graphdblite-*.tar.gz bundle/cli/graphdblite-*.zip bundle/sha256sums.txt \
            bundle/ffi/graphdblite-ffi-*.tar.gz bundle/ffi/graphdblite-ffi-*.zip \
            bundle/node/*.node \
            bundle/wheels/*.whl
